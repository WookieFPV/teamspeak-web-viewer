name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dependabot pull requests do not receive secrets, so fall back to
      # placeholders; the build only validates these values, it never
      # connects to the server.
      TS3_HOST: ${{ secrets.TS3_HOST || 'localhost' }}
      TS3_PASSWORD: ${{ secrets.TS3_PASSWORD || 'ci-placeholder' }}
      TS3_NICKNAME: ${{ secrets.TS3_NICKNAME }}
      TS3_USERNAME: ${{ secrets.TS3_USERNAME || 'serveradmin' }}

    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: |
          bun run ts3:up
          bun run test

      - name: Build
        run: bun run build
